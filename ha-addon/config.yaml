name: Boursicateur
version: "1.1.0"
slug: boursicateur
description: CAC 60 (CAC 40 + Next 20) / S&P 500 stock screener with daily Telegram summaries
url: https://github.com/Peperperrier/boursicateur
arch:
  - aarch64
  - amd64
startup: application
boot: auto
# Runs are triggered by Home Assistant automations through the hassio.addon_stdin action.
stdin: true
homeassistant_api: true
map:
  - type: homeassistant_config
    read_only: false
options:
  telegram_token: ""
  telegram_chat_id: ""
  attach_report: true
  www_folder: boursicateur
  ha_url: ""
schema:
  telegram_token: password
  telegram_chat_id: str
  attach_report: bool
  www_folder: match(^[A-Za-z0-9_-]+$)
  ha_url: str?
